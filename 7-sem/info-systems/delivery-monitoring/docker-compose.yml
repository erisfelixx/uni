services:
  # СУБД PostgreSQL — об'єкт спостереження
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: delivery
      POSTGRES_PASSWORD: delivery
      POSTGRES_DB: delivery
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro   # створення таблиць при першому запуску
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delivery -d delivery"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - delivery-net

  # Брокер повідомлень RabbitMQ (веб-інтерфейс: http://localhost:15672)
  rabbitmq:
    image: rabbitmq:4.0-management
    container_name: rabbitmq
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    ports:
      - "5672:5672"
      - "15672:15672"
      - "15692:15692"   # метрики для Prometheus (плагін rabbitmq_prometheus)
    volumes:
      - rabbit_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped
    networks:
      - delivery-net

  # Генератор подій (диспетчерська)
  producer:
    build: ./producer
    container_name: producer
    ports:
      - "8001:8000"     # метрики: http://localhost:8001/metrics
    environment:
      RABBIT_HOST: rabbitmq
      RABBIT_USER: admin
      RABBIT_PASS: admin
      OTLP_ENDPOINT: http://tempo:4318/v1/traces   # куди надсилати трейси
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - delivery-net

  # Обробник подій: RabbitMQ -> PostgreSQL
  worker:
    build: ./worker
    container_name: worker
    ports:
      - "8002:8000"     # метрики: http://localhost:8002/metrics
    environment:
      RABBIT_HOST: rabbitmq
      RABBIT_USER: admin
      RABBIT_PASS: admin
      DB_DSN: postgresql://delivery:delivery@postgres:5432/delivery
      OTLP_ENDPOINT: http://tempo:4318/v1/traces   # куди надсилати трейси
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - delivery-net

  # Експортер метрик PostgreSQL для Prometheus
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.16.0
    container_name: postgres-exporter
    environment:
      DATA_SOURCE_NAME: postgresql://delivery:delivery@postgres:5432/delivery?sslmode=disable
    ports:
      - "9187:9187"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - delivery-net

  # Prometheus — збір і зберігання метрик (http://localhost:9090)
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro   # правила алертів
      - prom_data:/prometheus          # вбудована БД часових рядів (TSDB)
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'       # дозволяє перечитати конфіг без перезапуску
      - '--web.enable-remote-write-receiver'   # дозволяє Tempo записувати метрики, пораховані з трейсів
    ports:
      - "9090:9090"
    depends_on:
      - alertmanager
    restart: unless-stopped
    networks:
      - delivery-net

  # Grafana — візуалізація (доступ лише через nginx + авторизацію: http://localhost:8080)
  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"            # заборона самостійної реєстрації
      GF_SERVER_ROOT_URL: http://localhost:8088/ # Grafana працює за nginx — для коректних посилань
      # Авторизація через наш сервер: Grafana довіряє імені користувача із заголовка від nginx
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: X-WEBAUTH-USER
      GF_AUTH_PROXY_HEADER_PROPERTY: username
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"         # створити користувача в Grafana при першому вході
      GF_AUTH_PROXY_HEADERS: "Role:X-WEBAUTH-ROLE"  # роль (Admin / Viewer) теж береться із заголовка
      GF_AUTH_PROXY_SYNC_TTL: "1"                # перечитувати дані користувача щохвилини
      GF_AUTH_DISABLE_LOGIN_FORM: "true"         # власна форма входу Grafana не потрібна
      GF_AUTH_SIGNOUT_REDIRECT_URL: /auth/logout # кнопка "Sign out" у Grafana -> вихід з нашої системи
      GF_LIVE_MAX_CONNECTIONS: "0"               # вимикаємо WebSocket-оновлення (не потрібні)
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/delivery.json  # шоб одразу після входу — наш дашборд
    volumes:
      - grafana_data:/var/lib/grafana                          # внутрішня БД Grafana (користувачі, налаштування)
      - ./grafana/provisioning:/etc/grafana/provisioning:ro     # автопідключення джерел даних і дашбордів
      - ./grafana/dashboards:/etc/grafana/dashboards:ro         # JSON-файли дашбордів
    # порт 3000 НЕ відкриваємо назовні: інакше можна обійти авторизацію
    depends_on:
      - prometheus
      - loki
      - tempo
    restart: unless-stopped
    networks:
      - delivery-net

  # Loki — сховище логів (API: http://localhost:3100)
  loki:
    image: grafana/loki:3.2.1
    container_name: loki
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki                # збережені логи
    ports:
      - "3100:3100"
    restart: unless-stopped
    networks:
      - delivery-net

  # Grafana Alloy — збирає логи всіх контейнерів і відправляє в Loki (UI: http://localhost:12345)
  alloy:
    image: grafana/alloy:v1.5.1
    container_name: alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro   # доступ до Docker, щоб читати логи контейнерів
      - alloy_data:/var/lib/alloy/data
    ports:
      - "12345:12345"
    depends_on:
      - loki
    restart: unless-stopped
    networks:
      - delivery-net

  # Tempo — сховище трейсів (API: http://localhost:3200)
  tempo:
    image: grafana/tempo:2.6.1
    container_name: tempo
    user: root                         # потрібен доступ на запис до тому /var/tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo          # збережені трейси
    ports:
      - "3200:3200"
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - delivery-net

  # Alertmanager — обробка алертів і розсилка сповіщень (http://localhost:9093)
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager   # стан алертів і "тиші" (silences)
    ports:
      - "9093:9093"
    depends_on:
      - alert-receiver
    restart: unless-stopped
    networks:
      - delivery-net

  # Отримувач сповіщень (webhook): записує алерти в лог -> Loki -> Grafana
  alert-receiver:
    build: ./alert-receiver
    container_name: alert-receiver
    restart: unless-stopped
    networks:
      - delivery-net

  # Сервер авторизації (Python + Flask + SQLite)
  auth:
    build: ./auth
    container_name: auth
    environment:
      AUTH_DB_PATH: /data/users.db
      JWT_SECRET: delivery-monitoring-secret-key-change-me-2026   # ключ підпису токенів (мін. 32 символи)
      JWT_TTL_HOURS: "8"
      ADMIN_USER: admin               # початкові користувачі (створюються, якщо база порожня)
      ADMIN_PASSWORD: admin123
      VIEWER_USER: viewer
      VIEWER_PASSWORD: viewer123
    volumes:
      - auth_data:/data               # файл SQLite з користувачами
    restart: unless-stopped
    networks:
      - delivery-net

  # Nginx — єдина точка входу: http://localhost:8088
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8088:80"
    depends_on:
      - auth
      - grafana
    restart: unless-stopped
    networks:
      - delivery-net

volumes:
  pg_data:
  rabbit_data:
  prom_data:
  grafana_data:
  loki_data:
  alloy_data:
  tempo_data:
  alertmanager_data:
  auth_data:

networks:
  delivery-net:
    driver: bridge