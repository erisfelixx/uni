# Джерела даних, які Grafana підключає при старті
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus              # фіксований id
    access: proxy                # запити йдуть через сервер Grafana
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    type: loki
    uid: loki                    # фіксований id — на нього посилаються панелі логів
    access: proxy
    url: http://loki:3100
    editable: false