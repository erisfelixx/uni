# Конфігурація Loki — сховища логів (режим "все в одному")
auth_enabled: false            # без багатокористувацького режиму

server:
  http_listen_port: 3100

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:                # логи зберігаються у файлах всередині контейнера
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

# Схема зберігання: індекс TSDB + шматки логів у файловій системі
schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 168h       # зберігати логи 7 днів

compactor:
  working_directory: /loki/compactor
  retention_enabled: true      # автоматично видаляти логи, старші за retention_period
  delete_request_store: filesystem