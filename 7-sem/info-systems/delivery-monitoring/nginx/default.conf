# Nginx - єдина точка входу в систему (http://localhost:8080).
# Кожен запит до Grafana спочатку перевіряється сервером авторизації (auth_request).

server {
    listen 80;

    # Сторінки сервера авторизації: вхід, вихід, керування користувачами
    location /auth/ {
        proxy_pass http://auth:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Внутрішній підзапит перевірки доступу (ззовні недоступний - internal)
    location = /_auth_verify {
        internal;
        proxy_pass http://auth:5000/auth/verify;
        proxy_pass_request_body off;              # тіло запиту для перевірки не потрібне
        proxy_set_header Content-Length "";
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Усе інше - Grafana, але лише для авторизованих
    location / {
        auth_request /_auth_verify;               # 200 -> пропустити, 401 -> @login

        # Ім'я і роль користувача з відповіді сервера авторизації -> заголовки для Grafana.
        # proxy_set_header ЗАМІНЮЄ такі заголовки, якщо їх спробує підробити сам клієнт.
        auth_request_set $auth_user $upstream_http_x_user;
        auth_request_set $auth_role $upstream_http_x_role;
        proxy_set_header X-WEBAUTH-USER $auth_user;
        proxy_set_header X-WEBAUTH-ROLE $auth_role;

        proxy_set_header Host $http_host;         # разом із портом (localhost:8080)
        proxy_pass http://grafana:3000;

        error_page 401 = @login;
    }

    # Неавторизований користувач -> сторінка входу (з запам'ятовуванням адреси, яку він відкривав)
    location @login {
        rewrite ^ /auth/login-redirect break;
        proxy_pass http://auth:5000;
        proxy_set_header X-Original-URI $request_uri;
    }
}