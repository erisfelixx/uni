# Nginx - єдина точка входу в систему (http://localhost:8088).
# Кожен запит до Grafana спочатку перевіряється сервером авторизації (auth_request).

server {
    listen 80;

    # Правка:(( Вбудований DNS Docker. Адреси сервісів перечитуються кожні 10 с, тому після перезапуску контейнера auth чи grafana nginx знайде його нову IP-адресу.
    # Для цього адреси в proxy_pass задаються через змінні.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Сторінки сервера авторизації: вхід, вихід, керування користувачами
    location /auth/ {
        set $auth_upstream http://auth:5000;
        proxy_pass $auth_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Внутрішній підзапит перевірки доступу (ззовні недоступний - internal)
    location = /_auth_verify {
        internal;
        set $auth_verify http://auth:5000/auth/verify;
        proxy_pass $auth_verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Усе інше - Grafana, але лише для авторизованих
    location / {
        auth_request /_auth_verify;               # 200 -> пропустити, 401 -> @login

        # Ім'я і роль користувача з відповіді сервера авторизації -> заголовки для Grafana.
        # proxy_set_header ЗАМІНЮЄ такі заголовки, якщо їх спробує підробити сам клієнт.
        auth_request_set $auth_user $upstream_http_x_user;
        auth_request_set $auth_role $upstream_http_x_role;
        proxy_set_header X-WEBAUTH-USER $auth_user;
        proxy_set_header X-WEBAUTH-ROLE $auth_role;

        set $grafana_upstream http://grafana:3000;
        proxy_set_header Host $http_host;         # разом із портом (localhost:8088)
        proxy_pass $grafana_upstream;

        error_page 401 = @login;
    }

    # Неавторизований користувач -> сторінка входу (з запам'ятовуванням адреси, яку він відкривав)
    location @login {
        set $auth_upstream http://auth:5000;      # set - до rewrite: після "break" він уже не виконався б
        rewrite ^ /auth/login-redirect break;
        proxy_pass $auth_upstream;
        proxy_set_header X-Original-URI $request_uri;
    }
}