global:
  scrape_interval: 10s       # як часто опитувати цілі
  evaluation_interval: 10s   # як часто перераховувати правила алертів

# Файли з правилами алертів
rule_files:
  - /etc/prometheus/alert_rules.yml

# Куди надсилати алерти, що спрацювали
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # Сам Prometheus
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Метрики СУБД PostgreSQL (через postgres-exporter)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # Метрики брокера RabbitMQ (вбудований плагін rabbitmq_prometheus)
  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']

  # Власні метрики сервісів (prometheus_client у Python)
  - job_name: 'producer'
    static_configs:
      - targets: ['producer:8000']

  - job_name: 'worker'
    static_configs:
      - targets: ['worker:8000']

  # Моніторинг самої системи логування
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']

  - job_name: 'alloy'
    static_configs:
      - targets: ['alloy:12345']

  # Моніторинг сховища трейсів
  - job_name: 'tempo'
    static_configs:
      - targets: ['tempo:3200']

  # Моніторинг системи сповіщень
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']

  # Сервер авторизації
  - job_name: 'auth'
    static_configs:
      - targets: ['auth:5000']