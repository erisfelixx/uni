# Конфігурація Tempo — сховища трейсів (режим "все в одному", дані на диску)
stream_over_http_enabled: true

server:
  http_listen_port: 3200          # API для Grafana

# Прийом трейсів від сервісів за протоколом OpenTelemetry (OTLP)
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318  # сюди надсилають трейси producer і worker

ingester:
  max_block_duration: 5m          # як часто скидати отримані трейси в блок на диску

compactor:
  compaction:
    block_retention: 48h          # зберігати трейси 2 доби

# Генератор метрик: з трейсів рахує метрики (тривалість спанів, граф сервісів) і пише їх у Prometheus
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  traces_storage:
    path: /var/tempo/generator/traces

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]